.workspace {
  --bg: #f4f6f3;
  --ink: #182c25;
  --muted: #536960;
  --green: #17684f;
  --line: #dce5df;
  --shadow: 0 8px 30px #203a2a08;
  --sidebar: #152923;
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  grid-template-rows: 1fr auto;
  min-block-size: 100vh;
  min-block-size: 100dvh;
}

.workspace .main {
  grid-column: 2;
  min-inline-size: 0;
  inline-size: min(100%, 1180px);
  min-block-size: 0;
  padding: 42px clamp(20px, 4vw, 56px) 48px;
}

.workspace .foot {
  grid-column: 2;
  color: var(--muted);
}

.workspace :is(a, button, input, select, textarea, summary):focus-visible {
  outline: 2px solid #29866a;
  outline-offset: 3px;
}

.skip-link {
  position: fixed;
  inset-block-start: 8px;
  inset-inline-start: 8px;
  z-index: 2;
  transform: translateY(-140%);
  background: white;
  padding: 10px 16px;
}

.skip-link:focus {
  transform: none;
}

.workspace-nav {
  grid-row: 1 / -1;
  position: sticky;
  inset-block-start: 0;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 24px;
  block-size: 100vh;
  block-size: 100dvh;
  overflow-y: auto;
  padding: 26px 18px 18px;
  background: var(--sidebar);
  color: white;
}

.workspace-nav :is(a, button):focus-visible {
  outline-color: #b4ebca;
}

.workspace-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  font-size: 17px;
  letter-spacing: -.035em;
  white-space: nowrap;
}

.workspace-brand strong {
  color: #b4ebca;
}

.workspace-brand:hover,
.workspace-add:hover {
  text-decoration: none;
}

.workspace-mark {
  display: grid;
  place-items: center;
  inline-size: 38px;
  block-size: 38px;
  border: 1px solid #66877a;
  border-radius: 10px;
  color: #b4ebca;
  font-size: 21px;
  font-weight: 800;
}

.workspace-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-block-size: 46px;
  padding: 7px 12px;
  border-radius: 10px;
  background: #b4ebca;
  color: #182d24;
  font-weight: 750;
}

.workspace-add:hover,
.workspace-add[aria-current] {
  background: #d8f5e2;
}

.workspace-add span {
  font-size: 20px;
  line-height: 1;
}

.workspace-links {
  display: grid;
  gap: 4px;
}

.workspace-links a {
  display: flex;
  align-items: center;
  min-block-size: 44px;
  padding: 8px 13px;
  border-radius: 9px;
  color: #d4e2db;
  text-decoration: none;
}

.workspace-links a:hover,
.workspace-links a[aria-current] {
  background: #2b463b;
  color: white;
}

.workspace-links a[aria-current] {
  box-shadow: inset -3px 0 #a6e2bb;
  font-weight: 750;
}

.workspace-account {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-block-start: auto;
  padding-block-start: 10px;
  border-block-start: 1px solid #40574d;
  color: #d4e2db;
}

.workspace-account bdi {
  overflow-wrap: anywhere;
}

.workspace-account button {
  min-block-size: 44px;
  padding: 5px 10px;
  border: 0;
  border-radius: 8px;
  background: #2b463b;
  color: white;
  font: inherit;
  white-space: nowrap;
  cursor: pointer;
}

.workspace .btn {
  min-block-size: 44px;
}

.overview-head {
  align-items: end;
  margin-block-end: 24px;
}

.overview-head h1 {
  margin-block: 0 5px;
  font-size: clamp(29px, 5vw, 48px);
  line-height: 1.12;
  letter-spacing: -.04em;
}

.overview-head p {
  font-size: 14px;
}

.overview-totals {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 16px;
  margin-block-end: 24px;
}

.week-net {
  display: flex;
  flex-direction: column;
  min-inline-size: 0;
  padding: clamp(19px, 3vw, 32px);
  border-radius: 18px;
  background: linear-gradient(135deg, #254f3f, #142d25 85%);
  color: #fff;
}

.week-net h2 {
  margin: 0;
  color: #dcebe2;
  font-size: 15px;
}

.overview-amount {
  margin-block-start: 6px;
  color: #d6f4df;
  font-size: clamp(32px, 5vw, 58px);
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  letter-spacing: -.04em;
  overflow-wrap: anywhere;
}

.week-net p {
  margin: 6px 0 20px;
  color: #cfdfd6;
}

.week-counts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: auto 0 0;
  padding-block-start: 14px;
  border-block-start: 1px solid #789084;
}

.week-counts dt {
  color: #dcebe2;
  font-size: 12px;
}

.week-counts dd {
  margin: 1px 0 0;
  font-size: 21px;
  font-weight: 750;
}

.week-breakdown {
  display: grid;
  align-content: stretch;
  margin: 0;
  padding: 6px clamp(14px, 2.5vw, 22px);
  border: 1px solid var(--line);
  border-radius: 18px;
  background: white;
  box-shadow: var(--shadow);
}

.week-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  padding-block: 12px;
}

.week-line + .week-line {
  border-block-start: 1px solid var(--line);
}

.week-line dt {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 650;
}

.week-line dd {
  margin: 0;
  font-size: clamp(18px, 2.4vw, 25px);
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.flow-symbol {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  inline-size: 34px;
  block-size: 34px;
  border-radius: 10px;
  background: #f6ece6;
  color: #884520;
  font-size: 20px;
}

.flow-symbol.incoming {
  background: #e4f3e9;
  color: #17684f;
}

.flow-symbol.refund {
  background: #eeeaf7;
  color: #5f477e;
}

.activity-panel .section-head {
  border-block-end: 1px solid var(--line);
  margin: 0;
  padding-block-end: 12px;
}

.activity-panel .section-head a,
.activity-contact a,
.transaction-form .form-footer a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-block-size: 44px;
}

.activity-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.activity-row {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding-block: 10px;
}

.activity-row + .activity-row {
  border-block-start: 1px solid var(--line);
}

.activity-contact {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 750;
}

.activity-contact a {
  display: flex;
  min-block-size: 30px;
  overflow-wrap: anywhere;
}

.activity-agent,
.activity-meta {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

.activity-meta,
.activity-value {
  display: grid;
  justify-items: start;
  gap: 3px;
}

.activity-value {
  justify-items: end;
  font-size: 16px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.activity-empty {
  padding-block: 18px 8px;
  text-align: center;
}

.transaction-form {
  display: grid;
  gap: 15px;
  max-inline-size: 900px;
}

.transaction-form fieldset {
  min-inline-size: 0;
  margin: 0;
  padding-block-start: 14px;
}

.transaction-form legend {
  padding-inline: 7px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 750;
}

.transaction-form :is(input, select, textarea) {
  min-inline-size: 0;
  min-block-size: 44px;
  font-size: 16px;
}

.transaction-form label {
  font-size: 14px;
}

.transaction-form textarea {
  resize: vertical;
}

.field-help {
  display: block;
  margin-block-start: 5px;
  color: var(--muted);
  font-size: 12px;
}

@container (max-width: 920px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 1fr auto;
  }

  .workspace .main,
  .workspace .foot {
    grid-column: 1;
  }

  .workspace-nav {
    position: static;
    grid-row: auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px 12px;
    block-size: auto;
    padding: max(13px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  }

  .workspace-links {
    grid-column: 1 / -1;
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .workspace-links a {
    justify-content: center;
    padding-inline: 5px;
    text-align: center;
  }

  .workspace-links a[aria-current] {
    box-shadow: inset 0 -2px #a6e2bb;
  }

  .workspace-account {
    grid-column: 1 / -1;
    justify-content: end;
    font-size: 12px;
    padding-block-start: 4px;
  }

  .workspace-account button {
    background: transparent;
  }

  .workspace .main {
    padding-block-start: 26px;
  }
}

@container (max-width: 600px) {
  .workspace .main {
    padding-inline: 15px;
  }

  .workspace-links {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .overview-head {
    flex-wrap: wrap;
    gap: 10px;
  }

  .overview-totals {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  .activity-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 4px 9px;
  }

  .activity-meta {
    grid-row: 2;
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }

  .activity-value {
    grid-column: 2;
    grid-row: 1;
  }
}

@media print {
  .workspace {
    display: block;
    background: white;
  }

  .workspace .main {
    inline-size: 100%;
    padding: 0;
  }

  .week-net {
    background: white;
    border: 1px solid #ddd;
  }

  .week-net * {
    color: black;
  }
}

      .workspace { min-block-size: 0; }
      .workspace-nav { position: static; align-self: stretch; block-size: auto; }
      .workspace a:not([href]):not([data-view]) { cursor: default; }
    </style>
  </template>
  <script>
    (() => {
      const root = document.getElementById('splinter-inline-preview');
      const frame = root.querySelector('.preview-frame');
      const shadow = frame.attachShadow({ mode: 'open' });
      const viewButtons = root.querySelectorAll('button[data-view]');
      const statusMessage = root.querySelector('[role="status"]');
      const dashboard = root.querySelector('.preview-dashboard').content;
      const activity = dashboard.querySelector('.activity-list');
      const rowTemplate = activity.firstElementChild;
      const extraRows = [];
      const labels = {
        incoming: { name: 'כניסה', sign: '+', symbol: '+' },
        refund: { name: 'החזר', sign: '−', symbol: '↶' },
        outgoing: { name: 'יציאה', sign: '−', symbol: '−' },
      };
      const amountFormat = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
      const currency = cents => '₪' + amountFormat.format(cents / 100);
      const week = [...dashboard.querySelectorAll('.overview-head p bdi')].map(date =>
        date.textContent.trim().split('.').reverse().join('-')
      );
      const currentWeek = date => week[0] <= date && date <= week[1];
      const originalTotals = [...dashboard.querySelectorAll('.week-line dd bdi')].map(
        value => parseAmount(value.textContent.replace(/[^0-9.]/g, ''))
      );
      const originalCount = Number(dashboard.querySelector('.week-counts dd').textContent);
      const initialContacts = [...activity.children]
        .filter(row => row.querySelector('.status.confirmed') && currentWeek(row.querySelector('time').dateTime))
        .map(row => row.querySelector('.activity-contact bdi').textContent.trim());

      function parseAmount(value) {
        const parts = /^(\d+)(?:\.(\d{1,2}))?$/.exec(value);
        return parts ? Number(parts[1]) * 100 + Number((parts[2] || '').padEnd(2, '0')) : NaN;
      }

      function refreshDashboard() {
        const periodRows = extraRows.filter(row => row.status === 'confirmed' && currentWeek(row.date));
        const totals = Object.keys(labels).map((kind, index) =>
          periodRows.filter(row => row.kind === kind).reduce((sum, row) => sum + row.cents, originalTotals[index])
        );
        shadow.querySelector('.overview-amount bdi').textContent = currency(totals[0] - totals[1] - totals[2]);
        shadow.querySelectorAll('.week-line dd bdi').forEach((value, index) => {
          value.textContent = currency(totals[index]);
        });
        const counts = shadow.querySelectorAll('.week-counts dd');
        counts[0].textContent = originalCount + periodRows.length;
        counts[1].textContent = new Set([...initialContacts, ...periodRows.map(row => row.phone)]).size;
        const recent = shadow.querySelector('.activity-list');
        for (const entry of extraRows) {
          const row = rowTemplate.cloneNode(true);
          const kind = labels[entry.kind];
          const icon = row.querySelector('.flow-symbol');
          icon.className = 'flow-symbol ' + entry.kind;
          icon.textContent = kind.symbol;
          row.querySelector('.activity-contact bdi').textContent = entry.phone;
          row.querySelector('.activity-agent').textContent = entry.agent;
          row.querySelector('.activity-meta span').textContent = kind.name + ' · ' + entry.method;
          const date = row.querySelector('time');
          date.dateTime = entry.date;
          date.textContent = entry.date;
          const value = row.querySelector('.activity-value bdi');
          value.className = entry.kind === 'incoming' ? 'positive' : 'negative';
          value.textContent = kind.sign + currency(entry.cents);
          const status = row.querySelector('.activity-value .status');
          status.className = 'status ' + entry.status;
          status.textContent = entry.status === 'confirmed' ? 'מאושר' : 'ממתין לאישור';
          recent.prepend(row);
        }
      }

      function show(view) {
        shadow.replaceChildren(
          root.querySelector('.preview-css').content.cloneNode(true),
          root.querySelector('.preview-' + view).content.cloneNode(true)
        );
        viewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
        if (view === 'dashboard') refreshDashboard();
      }
      root.addEventListener('click', event => {
        const viewButton = event.target.closest('button[data-view]');
        if (viewButton) show(viewButton.dataset.view);
        const sizeButton = event.target.closest('button[data-size]');
        if (sizeButton) {
          frame.dataset.size = sizeButton.dataset.size;
          root.querySelectorAll('button[data-size]').forEach(button => {
            button.setAttribute('aria-pressed', String(button === sizeButton));
          });
        }
      });
      shadow.addEventListener('click', event => {
        if (event.target.closest('[data-fill-demo]')) {
          const fields = shadow.querySelector('.transaction-form').elements;
          fields.phone.value = '0500000099';
          fields.amount.value = '250.00';
          fields.agent_id.selectedIndex = 1;
          fields.phone.setCustomValidity('');
          fields.amount.setCustomValidity('');
          return;
        }
        const link = event.target.closest('a[data-view]');
        if (link) {
          event.preventDefault();
          show(link.dataset.view);
          shadow.querySelector('main')?.focus();
        }
      });
      shadow.addEventListener('input', event => event.target.setCustomValidity?.(''));
      shadow.addEventListener('submit', event => {
        event.preventDefault();
        if (!event.target.matches('.transaction-form')) return;
        const fields = event.target.elements;
        const phone = fields.phone.value.replace(/[\s()-]/g, '');
        if (!/^0\d{8,9}$/.test(phone)) {
          fields.phone.setCustomValidity('הזן מספר דמו, למשל 0500000099.');
          fields.phone.reportValidity();
          return;
        }
        const cents = parseAmount(fields.amount.value);
        if (!Number.isSafeInteger(cents) || cents <= 0) {
          fields.amount.setCustomValidity('הזן סכום עם עד שתי ספרות אחרי הנקודה.');
          fields.amount.reportValidity();
          return;
        }
        const entry = {
          phone,
          cents,
          kind: fields.kind.value,
          agent: fields.agent_id.selectedOptions[0].textContent.trim(),
          method: fields.method.value,
          status: fields.status.value,
          date: fields.business_date.value,
        };
        extraRows.push(entry);
        statusMessage.hidden = false;
        statusMessage.textContent = entry.status === 'pending'
          ? 'תנועת הדמו נוספה וממתינה לאישור. הנטו נשאר כפי שהיה.'
          : currentWeek(entry.date)
            ? 'תנועת הדמו נוספה והנטו השבועי עודכן.'
            : 'תנועת הדמו נוספה. התאריך שלה מחוץ לשבוע המוצג.';
        show('dashboard');
        shadow.querySelector('main').focus();
      });
      show('dashboard');
    })();
  </script>
